model:
  architecture: resnet18
  num_classes: 10

training:
  epochs: 1
  batch_size: 128
  learning_rate: 0.001
  early_stopping_patience: 3

data:
  dataset: cifar10
  data_dir: ./data
  max_train_samples: 1000
  max_val_samples: 200

output:
  checkpoint_dir: ./checkpoints
  model_name: classifier_v1.pt